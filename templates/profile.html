{% extends "base.html" %}

{% block title %}Your profile — Spendly{% endblock %}

{% block content %}

<section class="profile-section">
    <div class="profile-container">

        <div class="profile-card">
            <div class="profile-avatar">{{ user.name[0] | upper }}</div>
            <h1 class="profile-name">{{ user.name }}</h1>
            <p class="profile-email">{{ user.email }}</p>
            <p class="profile-since">Member since {{ member_since }}</p>
        </div>

        <div class="profile-stats">
            <div class="profile-stat">
                <span class="profile-stat-label">Total spent</span>
                <span class="profile-stat-value">{{ total_spent }}</span>
            </div>
            <div class="profile-stat">
                <span class="profile-stat-label">Expenses logged</span>
                <span class="profile-stat-value">{{ expense_count }}</span>
            </div>
        </div>

    </div>
</section>

{% endblock %}
